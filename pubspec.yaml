name: klarna_mobile_sdk_flutter_workspace
description: Workspace root for the Klarna Mobile SDK Flutter packages.
publish_to: none

# Pub Workspaces (Dart >=3.6) — links all member packages so they resolve each
# other from disk without publishing. Add new packages under packages/ and list
# them here.
environment:
  sdk: ">=3.6.0 <4.0.0"

workspace:
  - packages/klarna_mobile_sdk_flutter
  - packages/klarna_network_core
  - example

# Melos orchestrates scripts (analyze, test, format) across every workspace package.
dev_dependencies:
  melos: ^6.3.0
